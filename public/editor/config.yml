# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

backend:
  name: github
  repo: MailTape/MailTape
  branch: main

media_folder: "public/img" # Location where files will be stored in the repo
public_folder: "/img" # The src attribute for uploaded media

media_libraries:
  aws_s3: 
    endpoint: https://garage.deuxfleurs.fr
    region: garage
    access_key_id: GK1e0c8b3ccc1d62df7e9c3a22
    public_url: https://sounds.mailta.pe
    bucket: sounds.mailta.pe
  stock_assets:
    providers: []

site_url: https://www.mailta.pe
logout_redirect_url: https://www.mailta.pe
logo:
  src: /img/logo_mailtape_static.png
  show_in_header: true
app_title: MailTape Editor

slug:
  encoding: "ascii"
  clean_accents: true
  sanitize_replacement: "-"
  lowercase: true

collections:
  - name: "episodes" # Used in routes, e.g., /admin/collections/blog
    label: "Episodes" # Used in the UI
    label_singular: "Episode"
    description: Welcome! Let's prepare some magic for our dear music lovers 💫
    folder: "src/content/episodes" # The path to the folder where the documents are stored
    create: true # Allow users to create new documents in this collection
    identifier_field: guest_name
    slug: 
      template: "{{pubDate}}-{{guest_name}}"
      editable: true
      hint: This is the filename of this episode. It's auto generated on creation. Should not need to be edited, unless you know what you're doing.
    summary: "Ep. {{release}} **{{guest_name}}** - {{pubDate | date('DD-MM-YY')}}"
    preview_path: '/{{release}}/{{guest_name | slugify}}'
    sortable_fields: 
      fields: ['pubDate','guest_name','release']
      default:
        field: pubDate
        direction: descending
    delete: false
    thumbnail: image
    view_filters:
      - label: "Aloyse"
        field: author
        pattern: 'Aloyse'
      - label: "Anaïs"
        field: author
        pattern: 'Anaïs G'
      - label: "Anto"
        field: author
        pattern: 'Anto'
      - label: "Jules"
        field: author
        pattern: 'Jules'
      - label: "ImaCrea"
        field: author
        pattern: 'ImaCrea'
      - label: "Inès"
        field: author
        pattern: 'Inès'
      - label: "Ling"
        field: author
        pattern: 'Ling'
      - label: "Sarah"
        field: author
        pattern: 'Sarah'
      - label: "Théo"
        field: author
        pattern: 'Théo'
    view_groups:
      - label: Year
        field: pubDate
        # groups items based on the value matched by the pattern
        pattern: \d{4}
      - label: MusiColor
        field: guest_color
    #preview_path: "{{ release }}/{{guest_name.slug}}"
    fields: # The fields for each document, usually in frontmatter
      - { label: "Published", preview: false, name: "published", widget: "boolean", default: false, hint: "When you're ready to preview your episode, check this and save. Wait 2-4 minutes to have it generated. For every time you save, allow a few minutes for episode to be re-generated." }
      - { label: "Publish Date", preview: false, name: "pubDate", widget: "datetime", date_format: "YYYY-MM-DD",type: date, hint: "Episode won't be available on homepage before. So don't worry when you publish for previewing." }
      - { label: "Episode number", preview: false, name: "release", widget: "number", value_type: int }
      - { label: "Guest", preview: false, name: "guest_name", widget: "string" }
      - { label: "Guest Color", preview: false, required: false, name: "guest_color", widget: "select", options: ["bliss","dreamy","rough", "trippy", "vibrant"], hint: "This is the color which highlights the episode on homepage"}
      - label: "Guest Pic"
        preview: false
        required: false
        name: "guestPic"
        widget: "image"
        media_libraries:
            all:
              max_file_size: 1024000
              filename_template: guestpic{{release}}
            aws_s3: false
      - { label: "Curator", preview: false, name: "author", widget: "select", options: ["Anaïs G","Aloyse","Anto","Jules","ImaCrea","Inès","Ling","Sarah","Théo"] }
      - { label: "Illustrator", preview: false, required: false, name: "illustrator", widget: "select", options: ["Anthony Dujardin","Antoine Gaudin","Babi Brunelio","Camille Célestin","Camille Lemeunier","Jan Henrik","Julie Wojtczak","Lucie Fléty","Marie Alléguède","Meriam Kharbat","Nella Papelita","Noémie Dijon", "Patricia Barros De Miranda","Pierre-Julien Fieux","Thibault Daumain"] }
      - { label: "Writer", preview: false, required: false, name: "writer", widget: "select", options:  ["Anaïs G","Aloyse","Anto","Jules","ImaCrea","Inès","Ling","PS KY","Sarah","Théo"]  }
      - label: "Track 1"
        name: track1
        widget: object
        required: false
        fields:
          - label: Band - Title
            name: title
            widget: string
            hint: "ex: David Bowie - Let's Dance"
          - label: "Color"
            name: color
            widget: select
            options:
              - {label: "Bliss", value: "bliss"}
              - {label: "Dreamy", value: "dreamy"}
              - {label: "Rough", value: "rough"}
              - {label: "Trippy", value: "trippy"}
              - {label: "Vibrant", value: "vibrant"}
          - label: "Link"
            name: link
            widget: file
            accept: audio/mpeg,.mp3
            media_libraries:
              default: false
              all:
                filename_template: track1
