# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

backend:
  name: github
  repo: MailTape/MailTape
  branch: main

media_folder: "public/img" # Location where files will be stored in the repo
public_folder: "" # The src attribute for uploaded media

media_libraries:
  aws_s3: 
    endpoint: https://garage.deuxfleurs.fr
    region: garage
    access_key_id: GK1e0c8b3ccc1d62df7e9c3a22
    public_url: https://sounds.mailta.pe
    bucket: sounds.mailta.pe
  stock_assets:
    providers: []

site_url: https://www.mailta.pe
logout_redirect_url: https://www.mailta.pe
logo:
  src: https://www.mailta.pe/img/logo_MailTape_static.png
  show_in_header: true
app_title: MailTape Editor

slug:
  encoding: "ascii"
  clean_accents: true
  sanitize_replacement: "_"

collections:
  - name: "episodes" # Used in routes, e.g., /admin/collections/blog
    label: "Episodes" # Used in the UI
    label_singular: "Episode"
    description: Welcome! Let's prepare some magic for our dear music lovers 💫
    folder: "src/content/episodes" # The path to the folder where the documents are stored
    create: true # Allow users to create new documents in this collection
    identifier_field: guest_name
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "Ep. {{category}} **{{guest_name}}** - {{pubDate | date('DD-MM-YY')}}"
    preview_path: '/{{category}}/{{slug}}'
    sortable_fields: 
      fields: ['pubDate','guest_name','category']
      default:
        field: pubDate
        direction: descending
    delete: false
    thumbnail: image
    view_filters:
      - label: "Aloyse"
        field: author
        pattern: 'Aloyse'
      - label: "Anaïs"
        field: author
        pattern: 'Anaïs G'
      - label: "Anto"
        field: author
        pattern: 'Anto'
      - label: "Jules"
        field: author
        pattern: 'Jules'
      - label: "ImaCrea"
        field: author
        pattern: 'ImaCrea'
      - label: "Inès"
        field: author
        pattern: 'Inès'
      - label: "Ling"
        field: author
        pattern: 'Ling'
      - label: "Sarah"
        field: author
        pattern: 'Sarah'
      - label: "Théo"
        field: author
        pattern: 'Théo'
    view_groups:
      - label: Year
        field: pubDate
        # groups items based on the value matched by the pattern
        pattern: \d{4}
      - label: MusiColor
        field: guest_color
    #preview_path: "{{ category }}/{{guest_name.slug}}"
    fields: # The fields for each document, usually in frontmatter
      - { label: "Published", name: "published", widget: "boolean", default: false, hint: "In order to preview your work, it needs to be published. Then wait a 1-2 minutes and you can go on something like mailta.pe/episodeNumber/my-guest-name/ Ex: mailta.pe/562/tiago-caetano/" }
      - { label: "Publish Date", name: "pubDate", widget: "datetime", date_format: "YYYY-MM-DD",type: date, hint: "Episode won't be available on homepage before this date. So don't worry when you publish before in order to preview." }
      - { label: "Episode number", name: "category", widget: "string" }
      - { label: "Guest", name: "guest_name", widget: "string" }
      - { label: "Guest Color", required: false, name: "guest_color", widget: "select", options: ["bliss","dreamy","rough", "trippy", "vibrant"], hint: "This is the color which highlights the episode on homepage"}
      - { label: "Guest Pic", required: false, name: "guestPic", widget: "image", media_library: {media_folder: "/public/img",config: { max_file_size: 10240000 } } }
      - { label: "Curator", name: "author", widget: "select", options: ["Anaïs G","Aloyse","Anto","Jules","ImaCrea","Inès","Ling","Sarah","Théo"] }
      - { label: "Illustrator", required: false, name: "illustrator", widget: "select", options: ["Anthony Dujardin","Antoine Gaudin","Babi Brunelio","Camille Célestin","Camille Lemeunier","Jan Henrik","Julie Wojtczak","Lucie Fléty","Marie Alléguède","Meriam Kharbat","Nella Papelita","Noémie Dijon", "Patricia Barros De Miranda","Pierre-Julien Fieux","Thibault Daumain"] }
      - { label: "Writer", required: false, name: "writer", widget: "select", options:  ["Anaïs G","Aloyse","Anto","Jules","ImaCrea","Inès","Ling","PS KY","Sarah","Théo"]  }
      - label: "Track 1"
        name: track1
        widget: object
        required: false
        fields:
          - label: Band - Title
            name: title
            widget: string
            required: false
            hint: "ex: David Bowie - Let's Dance"
          - label: "Color"
            name: color
            widget: select
            required: false
            options:
              - {label: "Bliss", value: "bliss"}
              - {label: "Dreamy", value: "dreamy"}
              - {label: "Rough", value: "rough"}
              - {label: "Trippy", value: "trippy"}
              - {label: "Vibrant", value: "vibrant"}
          - label: "Link"
            name: link
            widget: file
            required: false
            media_libraries:
