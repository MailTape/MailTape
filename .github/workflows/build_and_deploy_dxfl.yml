name: Build Astro and Publish on Deuxfleurs

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Verify package-lock.json
        run: npm ci --dry-run

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Check for outdated packages
        run: npm outdated
        continue-on-error: true

      - name: Build Astro project
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: website-build
          path: dist/
          retention-days: 1

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: website-build
          path: build/

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Deploy with dxfl
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.dxfl_id }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.dxfl_key }}
        run: npx --yes dxfl deploy www.mailta.pe build/ --yes
