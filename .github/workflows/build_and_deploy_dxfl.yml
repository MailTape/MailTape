name: Build Astro and Publish on Deuxfleurs

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Build Astro project
        run: bun run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: website-build
          path: dist/
          retention-days: 1

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: website-build
          path: build/

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Deploy with dxfl
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.dxfl_id }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.dxfl_key }}
        run: bunx dxfl deploy www.mailta.pe build/ --yes
