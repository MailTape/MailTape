name: Build Astro and Publish on Deuxfleurs

on:
  push:
    branches:
      - main
  schedule:
    - cron: '14 3 * * 0'
      timezone: "Europe/Paris"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Build Astro project
        run: bun run build

      # public/img (1.5GB) is committed to git; strip it so the artifact stays small.
      - name: Strip static images from artifact
        run: rm -rf dist/img

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: website-build
          path: dist/
          retention-days: 1

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: website-build
          path: build/

      # Restore images from the checkout (same commit the build ran on).
      - name: Restore static images
        run: cp -a public/img build/

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Deploy with dxfl
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.dxfl_id }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.dxfl_key }}
        run: bunx dxfl deploy www.mailta.pe build/ --yes --config-file build/deuxfleurs.toml
